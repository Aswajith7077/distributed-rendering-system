version: 1
disable_existing_loggers: false
formatters:
  standard:
    format: '[%(name)s] %(asctime)s - %(name)s - %(levelname)s - %(message)s'    
  detailed:
    format: '[%(levelname)s | %(asctime)s] %(module)s - %(name)s - %(funcName)s:%(lineno)d - %(message)s'   
    datefmt: '%Y-%m-%d %H:%M:%S'
  # json:
  #   class: formatters.json_formatter.JsonFormatter
  #   fmt_keys:
  #     level: levelname
  #     message: message
  #     time: asctime
  #     timestamp: timestamp
  #     logger: name
  #     module: module
  #     function: funcName
  #     line: lineno
  #     thread_name: threadName
handlers:
  stdout:
    class: logging.StreamHandler
    formatter: detailed
    stream: ext://sys.stdout
  # file:
  #   class: logging.handlers.RotatingFileHandler
  #   level: DEBUG
  #   formatter: detailed
  #   filename: logs/cicely.log
  #   maxBytes: 10485760 # 10MB
  #   backupCount: 5

  # json_file:
  #   class: logging.handlers.RotatingFileHandler
  #   level: DEBUG
  #   formatter: json
  #   filename: logs/cicely.jsonl
  #   maxBytes: 10485760 # 10MB
  #   backupCount: 5

  queue_handler:
    class: logging.handlers.QueueHandler
    handlers:
    - stdout
    # - file
    # - json_file
    respect_handler_level: true


loggers:
  root:
    level: DEBUG
    handlers: 
    - queue_handler
